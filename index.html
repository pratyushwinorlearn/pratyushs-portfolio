<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Phase 1</title>
    <style>
      /* ✅ Removed #root from this line so it doesn't get overflow: hidden */
      html, body { margin: 0; height: 100%; background: #000; overflow: clip; }
      
      /* ✅ Gave #root its own clean rule */
      #root { margin: 0; height: 100%; }

      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        color: #eee;
        font-family: monospace;
        font-size: 18px;
        background: rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="hint">
      <div>click to look around</div>
      <div style="font-size: 14px; opacity: 0.7;">WASD to move &nbsp;·&nbsp; V to toggle camera &nbsp;·&nbsp; ESC to release cursor</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
